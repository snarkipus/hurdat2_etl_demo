[project]
name = "etl-pipeline"
version = "0.1.0"
description = "Python ETL Pipeline using DuckDB"
authors = [{name = "Matt Jackson", email = "matt@jacksonsix.com"}]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "pydantic>=2.13.5,<3",
    "rich>=15.0.0,<16",
    "typer>=0.27.2,<0.28",
    "alembic>=1.19.2,<2",
    "duckdb>=1.5.5,<2",
    "duckdb-engine>=0.17.0,<0.18",
    "sqlalchemy>=2.0.52,<3",
    "structlog>=26.1.0,<27",
]

[project.scripts]
etl-pipeline = "etl_pipeline.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.40.0,<2",
    "pytest>=8.3.5,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.11.2,<0.12",
    "pre-commit>=4.2.0,<5",
    "pytest-mock>=3.14.0,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etl_pipeline"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# Ruff Configuration 
[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
    "build",
    "dist",
    "ref",
    "scripts",
    "src/etl_pipeline/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "E501"] 

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# BasedPyright Configuration
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --cov=src --cov-report=term-missing --cov-report=html --cov-report=lcov:lcov.info --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "pass"
]
