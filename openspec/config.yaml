schema: spec-driven

context: |
  Brownfield NOAA HURDAT2 ETL pipeline; historical DuckDB bootstrap baseline was 9af5d7a.
  Current tools: Python >=3.13,<4 (3.13 pin), uv/uv.lock, PEP 621/Hatchling,
  Typer, Pydantic, SQLAlchemy, DuckDB, packaged Alembic migrations, Rich,
  structlog JSON-line diagnostics, pytest, Ruff, and BasedPyright standard.
  Locked local hooks and Linux quality/wheel plus targeted Windows CI are configured.
  Root AGENTS.md is canonical repository guidance; read it before implementation.
  OpenSpec owns specification and intent. Beads owns execution state and dependencies.
  After reviewing proposal artifacts, map tasks.md to a Beads dependency graph;
  the mapping can be many-to-many. Implement through Beads, not opsx-apply.
  Reconcile tasks.md in the same session as verified Beads outcomes, then perform
  a final consistency check before OpenSpec sync/archive.
  Historical docs/archive/ material is evidence, not accepted specs or a backlog.
  See docs/README.md for documentation authority. Target-state diagrams are proposal
  artifacts, not evidence that the proposed architecture/tooling is implemented.
  Work sequentially in one checkout on feature branches; main is protected.
  No commits, pushes, or Dolt remote sync without explicit user approval.
  The CLI builds, migrates, commits, verifies and closes a sibling candidate before
  atomic publication. Existing output requires --replace; publication failure retains
  the verified candidate for manual recovery. No coordinate repair or automatic backup.
  Use ordinary local filesystems and quiescent writers; see README.md for operating limits.

rules:
  proposal:
    - State non-goals; toolchain, dependencies, logging, and runtime migrations require explicit scope approval.
    - Distinguish verified existing behavior from newly proposed requirements.
  tasks:
    - Produce a scope-based implementation checklist; after artifact review, map it to a Beads dependency graph without assuming a one-to-one mapping.
    - Record real Beads IDs beside mapped items and link issues back to change/spec paths and item scope; do not invent IDs or duplicate existing issues.
    - Beads is authoritative for claims, blockers, dependencies, and live execution status; do not duplicate these here.
    - Reconcile checklist items in the same session as verified Beads outcomes; check an item only when its entire scope is satisfied, not merely when one associated issue closes.
    - Cancelled or superseded issues do not imply completion; reconcile replacements or approved scope revisions and reopen affected items when requirements change.

operations:
  apply:
    guidance:
      - This repository does not normally use opsx-apply; follow the Beads-led execution flow in AGENTS.md and docs/agentic-workflow.md instead of the generated apply handoff.
  archive:
    guidance:
      - Perform a final consistency check of the continuously reconciled checklist, verified Beads outcomes, and approved scope before sync/archive; do not infer completion from prose or issue closure alone.
      - After archiving, update affected Beads spec references to the archive or canonical spec paths so links remain valid.
