repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix --exit-non-zero-on-fix src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked ruff format src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: basedpyright
        entry: uv run --locked basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
